[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "https://priyadharsan.netlify.app/*"
  to = "https://priyan.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://priyadharsan.netlify.app/*"
  to = "https://priyan.online/:splat"
  status = 301
  force = true